name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@4ebcf3dea4b29ee73e5c133d3da40ae01c89a194 # 5.9.3
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@4ebcf3dea4b29ee73e5c133d3da40ae01c89a194 # 5.9.3
    permissions:
      packages: write
    with:
      PUSH: false
