name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@298fae1fbc879585a0fc7dbf34e7dee04a0e6b0b # 5.9.1
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@298fae1fbc879585a0fc7dbf34e7dee04a0e6b0b # 5.9.1
    permissions:
      packages: write
    with:
      PUSH: false
