name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@7a088e5faf37b7992867f40fc1c17efa954d8c52 # 5.9.6
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@7a088e5faf37b7992867f40fc1c17efa954d8c52 # 5.9.6
    permissions:
      packages: write
    with:
      PUSH: false
