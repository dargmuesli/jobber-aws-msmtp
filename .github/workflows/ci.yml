name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@121d4c605f0d1d6eeca65ad8026ac09d7594fe76 # 5.9.8
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@121d4c605f0d1d6eeca65ad8026ac09d7594fe76 # 5.9.8
    permissions:
      packages: write
    with:
      PUSH: false
