name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@8da8c1b192d3098dd3b50303232a04fbf8c90b53 # 5.9.5
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@8da8c1b192d3098dd3b50303232a04fbf8c90b53 # 5.9.5
    permissions:
      packages: write
    with:
      PUSH: false
